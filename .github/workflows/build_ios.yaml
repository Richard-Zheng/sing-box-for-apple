name: Build TrollStore TIPA

on:
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: "sing-box git ref to build Libbox from (defaults to v<MARKETING_VERSION>)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Resolve version and sing-box ref
        id: ref
        run: |
          # Parse pbxproj directly: the SFI app uses a 3-part numeric MARKETING_VERSION
          # (e.g. "1.13.12"). The HelperService uses "1.13.0-alpha.21" (excluded by the
          # `[0-9]+\.[0-9]+\.[0-9]+` shape) and extensions use bare `1.0` (excluded by
          # the surrounding quotes).
          version="$(grep -E 'MARKETING_VERSION = "[0-9]+\.[0-9]+\.[0-9]+";' \
            sing-box.xcodeproj/project.pbxproj \
            | sed -E 's/.*"([^"]+)".*/\1/' | sort -u | tail -1)"
          if [ -z "$version" ]; then
            echo "Failed to read MARKETING_VERSION from pbxproj" >&2
            version="1.14.0"
          fi
          if [ -n "${{ inputs.sing_box_ref }}" ]; then
            ref="${{ inputs.sing_box_ref }}"
          else
            ref="v1.14.0-alpha.28"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "App version: ${version}, sing-box ref: ${ref}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.10
          cache: false

      - name: Install ldid and xcbeautify
        run: brew install ldid xcbeautify

      - name: Clone sing-box
        run: |
          git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" \
            https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"

      - name: Cache Libbox.xcframework
        id: cache-libbox
        uses: actions/cache@v4
        with:
          path: Libbox.xcframework
          key: libbox-${{ runner.os }}-${{ steps.ref.outputs.ref }}-v1

      - name: Install gomobile (SagerNet fork)
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/sing-box
        run: make lib_install

      - name: Build Libbox.xcframework
        if: steps.cache-libbox.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/sing-box
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_apple
          cp -R Libbox.xcframework "$GITHUB_WORKSPACE/Libbox.xcframework"

      - name: Resolve SPM packages
        run: |
          xcodebuild -resolvePackageDependencies -scheme SFI

      - name: Archive SFI (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SFI.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            2>&1 | tee build/xcodebuild.log | xcbeautify --renderer github-actions

      - name: Show raw build errors on failure
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            echo "::group::Raw xcodebuild errors"
            grep -E "error:|note:.*declared here|FAILED|cannot find" build/xcodebuild.log | head -80 || true
            echo "::endgroup::"
            echo "::group::Last 200 lines of raw log"
            tail -200 build/xcodebuild.log
            echo "::endgroup::"
          fi

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Inspect archive
        run: |
          echo "--- build/ tree ---"
          find build -maxdepth 6 -name "*.app" -o -name "Applications" -type d
          echo "--- Applications/ contents ---"
          ls -la build/SFI.xcarchive/Products/Applications/ 2>&1 || true

      - name: Package unsigned IPA
        id: ipa
        run: |
          APP_PATH=$(find build/SFI.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app found in xcarchive Products/Applications"
            echo "Archive contents:"
            ls -R build/SFI.xcarchive
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create a simple IPA (just a zip with .app inside Payload/)
          mkdir -p build/SFI/Payload
          cp -R "$APP_PATH" build/SFI/Payload/
          cd build/SFI
          zip -r SFI-unsigned.ipa Payload
          cd ../..
          
          echo "Created unsigned IPA"
          ls -lh build/SFI/SFI-unsigned.ipa
      
      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-unsigned-ipa
          path: build/SFI/*.ipa
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-xcarchive
          path: build/SFI.xcarchive
          retention-days: 7

      - name: Package TIPA
        id: tipa
        run: |
          app="$(find build/SFI.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d | head -1)"
          if [ -z "$app" ]; then
            echo "No .app found in archive" >&2; exit 1
          fi
          echo "Found app: $app"
          out="build/SFI-${{ steps.ref.outputs.version }}-TrollStore.tipa"
          bash scripts/make_tipa.sh "$app" "$out"
          echo "path=${out}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"

      - name: Upload TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tipa.outputs.name }}
          path: ${{ steps.tipa.outputs.path }}
          if-no-files-found: error
